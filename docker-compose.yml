services:
  consul:
    image: hashicorp/consul:1.16.1
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - soa-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  service1-instance1:
    build:
      context: ./service1-jetty
      dockerfile: Dockerfile
    container_name: service1-instance1
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=18443
      - INSTANCE_TAG=instance1
      - INSTANCE_HOSTNAME=service1-instance1
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - "18443:18443"
    networks:
      - soa-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:18443/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  service1-instance2:
    build:
      context: ./service1-jetty
      dockerfile: Dockerfile
    container_name: service1-instance2
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=18543
      - INSTANCE_TAG=instance2
      - INSTANCE_HOSTNAME=service1-instance2
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - "18543:18543"
    networks:
      - soa-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:18543/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  service1-instance3:
    build:
      context: ./service1-jetty
      dockerfile: Dockerfile
    container_name: service1-instance3
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=18643
      - INSTANCE_TAG=instance3
