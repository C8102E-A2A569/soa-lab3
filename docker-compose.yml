      - CONSUL_PORT=8500
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - "18643:18643"
    networks:
      - soa-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:18643/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  service1-instance4:
    build:
      context: ./service1-jetty
      dockerfile: Dockerfile
    container_name: service1-instance4
    environment:
      - SPRING_PROFILES_ACTIVE=docker
