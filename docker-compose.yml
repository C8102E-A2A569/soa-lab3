      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    ports:
      - "18743:18743"
    networks:
      - soa-network
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:18743/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  

  haproxy-service1:
    build:
      context: ./haproxy
      dockerfile: Dockerfile
    image: lab2-haproxy-consul:latest
    container_name: haproxy-service1
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
      - HAPROXY_CFG=/tmp/haproxy.cfg
      - HAPROXY_EXPECTED_INSTANCES=4
    ports:
      - "8443:8443"
      - "8404:8404"
    volumes:
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
    networks:
      - soa-network
    depends_on:
      consul:
        condition: service_healthy

networks:
  soa-network:
    driver: bridge

volumes:
  postgres-data: