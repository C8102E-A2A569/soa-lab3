global
    log stdout format raw local0
    maxconn 4096

resolvers docker
    nameserver dns1 127.0.0.11:53
    timeout retry 1s
    hold valid 5s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend service1_frontend
    bind *:8443 ssl crt /usr/local/etc/haproxy/certs/service1.pem
    mode http
    default_backend service1_backend

    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "*"

backend service1_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /actuator/health ver HTTP/1.1 hdr Host localhost
    timeout connect 5000

    server service1-instance1 service1-instance1:18443 check ssl verify none inter 15s resolvers docker init-addr none
    server service1-instance2 service1-instance2:18543 check ssl verify none inter 15s resolvers docker init-addr none

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE

