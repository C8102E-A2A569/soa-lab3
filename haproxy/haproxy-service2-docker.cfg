# HAProxy для Service2 — вариант для запуска в Docker (бэкенды на хосте)
# host.docker.internal = хост Windows при запуске контейнера

global
    maxconn 4096

defaults
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend service2_frontend
    bind *:9090
    mode http
    default_backend service2_backend

backend service2_backend
    mode http
    balance roundrobin
    # TCP check only (HTTP check на / возвращал 500 и помечал бэкенды DOWN)
    timeout connect 5000
    server wildfly1 host.docker.internal:8080 check inter 10s
    server wildfly2 host.docker.internal:8180 check inter 10s

listen stats
    bind *:9091
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
