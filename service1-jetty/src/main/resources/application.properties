spring.application.name=service1-jetty

server.port=18443
# SSL Configuration
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore-service1.p12
server.ssl.key-store-password=333444
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=service1

# Database configuration (локальная разработка; на сервере можно переопределить через переменные окружения)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Consul: по умолчанию отключён для локального запуска без Docker (mvn spring-boot:run).
# Исключаем автоконфигурацию Consul, чтобы не создавался ConsulCatalogWatch (подключение к localhost:8500).
# В Docker (профили instance1/instance2) это исключение сбрасывается.
spring.autoconfigure.exclude=org.springframework.cloud.consul.ConsulAutoConfiguration,org.springframework.cloud.consul.discovery.ConsulDiscoveryClientConfiguration,org.springframework.cloud.consul.serviceregistry.ConsulServiceRegistryAutoConfiguration,org.springframework.cloud.consul.serviceregistry.ConsulAutoServiceRegistrationAutoConfiguration
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=false
spring.cloud.consul.discovery.register=false
spring.cloud.consul.discovery.deregister=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${server.port}
spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.health-check-timeout=5s
spring.cloud.consul.discovery.scheme=https

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always