server.port=18443
# Слушать на всех интерфейсах, чтобы HAProxy и Consul из других контейнеров могли подключиться
server.address=0.0.0.0
# Включаем Consul и убираем исключение автоконфигурации (Docker)
spring.autoconfigure.exclude=
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:instance1:${server.port}
spring.cloud.consul.discovery.hostname=${INSTANCE_HOSTNAME:localhost}
# Сертификат для localhost — в Docker Consul проверяет по IP; не проверять TLS при health check
spring.cloud.consul.discovery.health-check-tls-skip-verify=true